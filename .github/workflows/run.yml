name: Tender Bot Worker

on:
  schedule:
    - cron: "*/30 * * * *"   # كل 30 دقيقة
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      # 1- تحميل الكود
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2- تجهيز بايثون
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3- تثبيت المكتبات
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 4- إنشاء ملف Firebase من Secret
      - name: Create Firebase credentials file
        run: |
          printf '%s' "${{ secrets.FIREBASE_KEY }}" > serviceAccount.json

      # 5- تشغيل البوت
      - name: Run bot
        run: python main.py
