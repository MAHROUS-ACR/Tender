name: Tender Bot

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Chrome (Selenium)
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      # 🔥 Debug: تأكيد إن الـ secret داخل
      - name: Debug Firebase Secret Length
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS_B64 }}
        run: |
          echo "🔥 SECRET LENGTH = ${#FIREBASE_CREDENTIALS}"
          echo "🔥 FIRST 50 CHARS = ${FIREBASE_CREDENTIALS:0:50}"

      # 🚀 Run bot
      - name: Run bot
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS_B64 }}
        run: python main.py
