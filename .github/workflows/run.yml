name: Tender Bot Worker

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: pip install -r requirements.txt

      - name: Create Firebase file
        run: printf '%s' "${{ secrets.FIREBASE_KEY }}" > serviceAccount.json

      - name: Run bot
        run: python main.py
