name: Tender Bot Worker

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Create Firebase credentials file
        run: |
          echo "${{ secrets.FIREBASE_KEY }}" | jq '.' > serviceAccount.json

      - name: Run bot
        run: python main.py
