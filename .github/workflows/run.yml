name: Tender Bot Worker

on:
  schedule:
    - cron: "*/30 * * * *"   # كل 30 دقيقة
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 🔥 الحل الصح لكتابة Firebase file بدون ما نبوّظ JSON
      - name: Create Firebase credentials file
        run: |
          printf '%s' "${{ secrets.FIREBASE_KEY }}" > serviceAccount.json

      # (اختياري للتأكد فقط - احذفه بعد ما تتأكد إنه شغال)
      # - name: Debug Firebase file
      #   run: cat serviceAccount.json

      - name: Run bot
        run: python main.py
